  for(const s of [-1,1]){
    const hinge=new THREE.Group();hinge.position.set(-.08,.41,s*.28);body.add(hinge);const ghosts=[];
    for(let q=0;q<3;q++){
      const ghost=new THREE.Group();hinge.add(ghost);ghosts.push(ghost);
      const material=new THREE.MeshStandardMaterial({color:q===0?0xe2f7fb:0xc8ecf4,transparent:true,opacity:q===0?.7:.1,roughness:.6,depthWrite:q===0});
      const segments=[[-.05,.42,.55,.75],[-.15,1.05,.85,.65],[-.3,1.65,1.0,.65],[-.45,2.14,.7,.4]];
      for(const [x,z,w,d] of segments){const block=new THREE.Mesh(new THREE.BoxGeometry(w,.045,d),material);block.position.set(x,0,s*z);ghost.add(block);}
      if(q===0){
        const rib=new THREE.Mesh(new THREE.BoxGeometry(.035,.052,2.25),new THREE.MeshStandardMaterial({color:0xa3cbd5,transparent:true,opacity:.65}));
        rib.position.set(-.17,0,s*1.18);rib.rotation.y=s*.12;ghost.add(rib);
      }
    }
    hinge.userData.ghosts=ghosts;wings[s]=hinge;
  }
  scene.add(fly);
}

// ------------------------------------------------------------------ CNS inset (point cloud)
function buildInset(cns, graftSize) {
  if (!cns) return;
  const n = cns.xyz.length / 3;
  const pos = new Float32Array(cns.xyz); const col = new Float32Array(n * 3);
  const sizes = new Float32Array(n);
  const base = new THREE.Color(0xc9d3df), les = new THREE.Color(0xeb6834);
  for (let i = 0; i < n; i++) { const c = cns.lesion[i] ? les : base; col[3 * i] = c.r; col[3 * i + 1] = c.g; col[3 * i + 2] = c.b; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({size: 2.2, vertexColors: true, sizeAttenuation: false, transparent: true, opacity: 0.85});
  insetCloud = new THREE.Points(g, m); insetScene.add(insetCloud);
  // lesioned neurons drawn again, larger, on top
  if (cns.lesion.some(v => v)) {
    const lp = []; for (let i = 0; i < n; i++) if (cns.lesion[i]) lp.push(pos[3 * i], pos[3 * i + 1], pos[3 * i + 2]);
    const g2 = new THREE.BufferGeometry(); g2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lp), 3));
    insetScene.add(new THREE.Points(g2, new THREE.PointsMaterial({size: 3.2, color: 0xeb6834, sizeAttenuation: false})));
  }
  if (cns.graft && cns.graft.length) {
    const g3 = new THREE.BufferGeometry(); g3.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cns.graft), 3));
    const gm = new THREE.PointsMaterial({size: graftSize || 3.4, color: 0x1baf7a, sizeAttenuation: false, depthTest: false});
    const gp = new THREE.Points(g3, gm); gp.renderOrder = 10; insetScene.add(gp);
  }
  insetScene.userData.center = new THREE.Vector3(cns.center[0], cns.center[1], cns.center[2]);
  insetScene.userData.radius = cns.radius;
}

// ------------------------------------------------------------------ data + per-frame update
function setData(d) { DATA = d; buildInset(d.cns, d.graft_size);
  let mx = 0, mz = 0; for (const p of d.traj) { mx += p[3]; mz -= p[4]; } mx = mx / d.traj.length * S; mz = mz / d.traj.length * S;
  buildLandmarks();
  document.getElementById('title').textContent = d.title; document.getElementById('sub').textContent = d.subtitle;
  const tier = document.getElementById('tier'); tier.textContent = d.tier_label; tier.style.background = d.tier_color;
  document.getElementById('insetlabel').innerHTML = d.inset_label;
  trail.material.color.set(d.color);crumbs.material.color.set(d.color);crumbs.material.emissive.set(d.color);document.getElementById('title').style.color=d.color;
}

function lerpAngle(a, b, t) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; }

let camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), camInit = false, lastT = 0;

function sampleArray(array, f) {
  const j=Math.max(0,Math.min(Math.floor(f),array.length-1)), k=Math.min(j+1,array.length-1), u=f-j;
  if(Array.isArray(array[j])) return array[j].map((v,l)=>v+(array[k][l]-v)*u);
  return array[j]+(array[k]-array[j])*u;
}

function drawReference(f,t) {
 const c=document.getElementById('pathmap'),g=c.getContext('2d'),[xmin,xmax,ymin,ymax]=DATA.reference_bounds;
 c.style.display='block';const w=c.width,h=c.height,L=37,R=10,T=21,B=32;
 const px=v=>L+(v-xmin)/(xmax-xmin)*(w-L-R),py=v=>h-B-(v-ymin)/(ymax-ymin)*(h-B-T);
 g.clearRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.96)';g.fillRect(0,0,w,h);
 g.strokeStyle='#b8c2ca';g.lineWidth=1;g.beginPath();g.moveTo(L,T);g.lineTo(L,h-B);g.lineTo(w-R,h-B);g.stroke();
 g.font='11px Arial';g.fillStyle='#44515b';g.textAlign='center';
 for(const v of [xmin,xmax]){g.fillText(v.toFixed(1),px(v),h-B+13);}
 g.textAlign='right';for(const v of [ymin,ymax])g.fillText(v.toFixed(1),L-4,py(v)+3);
 g.textAlign='center';g.fillText('Lateral displacement (m)',w/2+12,h-3);
 g.save();g.translate(11,h/2);g.rotate(-Math.PI/2);g.fillText('Forward (m)',0,0);g.restore();
 function path(tr,color,dash) {
  g.strokeStyle=color;g.lineWidth=2;g.setLineDash(dash);g.beginPath();const x0=tr[0][3],y0=tr[0][4];
  for(let j=0;j<=Math.floor(f);j+=15){const p=tr[j];if(j===0)g.moveTo(px(p[4]-y0),py(p[3]-x0));else g.lineTo(px(p[4]-y0),py(p[3]-x0));}
  const p=sampleArray(tr,f);g.lineTo(px(p[4]-y0),py(p[3]-x0));g.stroke();g.setLineDash([]);
  g.beginPath();g.arc(px(p[4]-y0),py(p[3]-x0),3.2,0,2*Math.PI);g.fillStyle=color;g.fill();
 }
 path(DATA.reference,'#8c969e',[3,3]);path(DATA.traj,DATA.color,[]);
 g.fillStyle='#44515b';g.font='12px Arial';g.textAlign='left';g.fillText('Intact reference',L,13);
}
function renderFrame(timeMs) {
  const f=Math.max(0,Math.min(timeMs,DATA.traj.length-1));
  const tr=DATA.traj, [t,psi,omega,x,y]=sampleArray(tr,f);
  const bodyHeading=sampleArray(DATA.body_heading,f), cameraHeading=sampleArray(DATA.camera_heading,f);
  const roll=sampleArray(DATA.display_roll,f), turn=sampleArray(DATA.display_turn,f);
  const alt=4., X=x*S, Z=-y*S;
  const pitch=.32, freq=11;
  const ampL=1+.35*Math.max(turn,0)-.25*Math.max(-turn,0);
  const ampR=1+.35*Math.max(-turn,0)-.25*Math.max(turn,0);
  const phase=2*Math.PI*freq*t;
  fly.position.set(X,alt,Z);fly.rotation.set(0,bodyHeading,0);
  fly.userData.body.rotation.set(roll,0,pitch);
  wings[-1].rotation.set(.25,.22,.05);wings[1].rotation.set(-.25,-.22,.05);
  for(let q=0;q<3;q++) {
    const ph=phase+q*2.1;
    wings[-1].userData.ghosts[q].rotation.x=-.95*ampL*Math.sin(ph);
    wings[1].userData.ghosts[q].rotation.x=.95*ampR*Math.sin(ph);
  }
  let k=0;
  for(let j=0;j<=Math.floor(f);j+=10) {const p=tr[j];trailPos[k*3]=p[3]*S;trailPos[k*3+1]=.05;trailPos[k*3+2]=-p[4]*S;k++;}
  trailPos[k*3]=X;trailPos[k*3+1]=.05;trailPos[k*3+2]=Z;k++;
  trailGeo.setDrawRange(0,k);trailGeo.attributes.position.needsUpdate=true;
  let nc=0;
  for(const p of DATA.trail_dots) {if(p[0]>t||nc>=400)break;_m4.makeTranslation(p[1]*S,4.,-p[2]*S);crumbs.setMatrixAt(nc++,_m4);}
  crumbs.count=nc;crumbs.instanceMatrix.needsUpdate=true;
  const back=new THREE.Vector3(-Math.cos(cameraHeading),0,Math.sin(cameraHeading)).multiplyScalar(13.);
  const side=new THREE.Vector3(Math.sin(cameraHeading),0,Math.cos(cameraHeading)).multiplyScalar(4.);
  const offset=back.add(side).add(new THREE.Vector3(0,6.,0));
  camera.position.set(X,alt,Z).add(offset);camera.lookAt(fly.position);
  scene.userData.sun.position.set(X+14,30,Z+10);scene.userData.sun.target.position.set(X,0,Z);scene.userData.sun.target.updateMatrixWorld();
  renderer.setViewport(0,0,W,H);renderer.setScissor(0,0,W,H);renderer.setScissorTest(false);renderer.render(scene,camera);
  if(insetCloud) {
    const iw=Math.round(W*.25),ih=Math.round(iw*.78),ix=W-iw-24,iy=H-ih-56;
    renderer.setViewport(ix,iy,iw,ih);renderer.setScissor(ix,iy,iw,ih);renderer.setScissorTest(true);renderer.autoClear=false;
    const c=insetScene.userData.center,R=insetScene.userData.radius,ang=.55*Math.sin(.45*t);
    insetCam.aspect=iw/ih;insetCam.updateProjectionMatrix();
    insetCam.position.set(c.x+R*2.4*Math.sin(ang),c.y+R*2.4*Math.cos(ang),c.z);insetCam.up.set(0,0,-1);insetCam.lookAt(c);
    const fr=document.getElementById('insetframe');fr.style.left=ix+'px';fr.style.top=(H-iy-ih)+'px';fr.style.width=iw+'px';fr.style.height=ih+'px';
    renderer.render(insetScene,insetCam);renderer.autoClear=true;renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);
  }
  const displacement=Math.hypot(x-tr[0][3],y-tr[0][4]), length=sampleArray(DATA.path_length,f), straight=length>0?displacement/length:1;
  document.getElementById('stats').innerHTML=`Distance <b>${displacement.toFixed(2)} m</b><br>Straightness <b>${straight.toFixed(2)}</b>`;
  document.getElementById('time').textContent=`t = ${t.toFixed(1)} s`;

  return {model_time:t,model_x:x,model_y:y,raw_heading:psi,camera_heading:cameraHeading,body_heading:bodyHeading,roll:roll,
    camera_distance:camera.position.distanceTo(fly.position),fly_scale:fly.scale.toArray(),field_of_view:camera.fov,
    displacement_m:displacement,path_length_m:length,straightness:straight,
    landmark_count:scene.userData.landmarkCount,landmark_layout:scene.userData.landmarkLayout,style:'voxel',trail_dot_count:nc,dynamic_trails_not_culled:!crumbs.frustumCulled&&!trail.frustumCulled};
}

function pathStraightness(tr, i) {
  if (i < 5) return 1;
  let L = 0; for (let j = 1; j <= i; j++) L += Math.hypot(tr[j][3] - tr[j - 1][3], tr[j][4] - tr[j - 1][4]);
  return L > 0 ? Math.hypot(tr[i][3] - tr[0][3], tr[i][4] - tr[0][4]) / L : 1;
}
window.init = init; window.setData = setData; window.renderFrame = renderFrame;
